# =============================================================================
# omnisight — Master Docker Compose (bootstrap scaffolding)
# Blueprint : osc_docs/architecture.md
# Author    : ai-main (PM & Docker DevOps Architect)
#
# Services:
#   osc_base  : PostgreSQL 18 (service existing — konvensi dipertahankan)
#   osc_file  : RustFS S3-compatible object storage (internal only)
#   osc_rest  : Rust REST API (internal only)     [Dockerfile: tersedia (ai-rest)]
#   osc_site  : Next.js UI + BFF Proxy (public)   [Dockerfile: fase ai-site]
#
# Network isolation:
#   blackbox     (external, pre-existing) -> akses host/legacy + static IP
#   osc_internal (internal: true)         -> postgres / rustfs / rest / site
#   osc_edge     (public bridge)          -> osc_site saja; satu-satunya
#                                            published port stack
#
# Catatan: seluruh service kini memiliki Dockerfile & healthcheck
#          (ai-rest: osc_rest, ai-site: osc_site).
# =============================================================================

name: omnisight

networks:
  blackbox:
    name: blackbox
    external: true

volumes:
  xbase: # PostgreSQL
    driver: local
  xfile: # RustFS object storage
    driver: local

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  osc_base:
    image: postgres:18-alpine
    container_name: osc_base
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - "no-new-privileges:true"
    environment:
      - TZ=${TZ:-Asia/Jakarta}
      - POSTGRES_DB=${PG_DATA:-osc}
      - POSTGRES_USER=${PG_USER:-dbe}
      - POSTGRES_PASSWORD=${PG_PASS:-password_osc_dbe}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - xbase:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-dbe} -d ${PG_DATA:-osc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      blackbox:
        ipv4_address: 172.99.66.1

  # ---------------------------------------------------------------------------
  # RustFS — S3-compatible object storage
  # ---------------------------------------------------------------------------
  osc_file:
    image: rustfs/rustfs:1.0.4
    container_name: osc_file
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - "no-new-privileges:true"
    environment:
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-oscadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-password_osc_rustfs}
    volumes:
      - xfile:/data
    # ports:
    # - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      blackbox:
        ipv4_address: 172.99.66.2

  # ---------------------------------------------------------------------------
  # osc_save — one-shot bootstrap bucket (minio/mc)
  # Membuat bucket default secara idempotent setelah osc_file healthy:
  #   osc-assets-files / osc-pam-recordings / osc-config-backups
  # (RUSTFS_BUCKET lama tetap ada di volume; tidak dihapus — aman untuk
  #  konfigurasi existing. Exit 0 → container berhenti, tidak di-restart.)
  # ---------------------------------------------------------------------------
  osc_save:
    image: minio/mc:latest
    container_name: osc_save
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    security_opt:
      - "no-new-privileges:true"
    environment:
      - RUSTFS_ENDPOINT=http://osc_file:9000
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-oscadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-password_osc_rustfs}
      - RUSTFS_BUCKET_FILES=${RUSTFS_BUCKET_FILES:-osc-assets-files}
      - RUSTFS_BUCKET_PAM=${RUSTFS_BUCKET_PAM:-osc-pam-recordings}
      - RUSTFS_BUCKET_BACKUPS=${RUSTFS_BUCKET_BACKUPS:-osc-config-backups}
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        mc alias set local "$${RUSTFS_ENDPOINT}" "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${RUSTFS_BUCKET_FILES}" &&
        mc mb --ignore-existing "local/$${RUSTFS_BUCKET_PAM}" &&
        mc mb --ignore-existing "local/$${RUSTFS_BUCKET_BACKUPS}"
    depends_on:
      osc_file:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      blackbox:
        ipv4_address: 172.99.66.5

  # ---------------------------------------------------------------------------
  # Rust Clean Architecture REST API
  # Dockerfile: multi-stage cargo-chef -> bookworm-slim, non-root UID 10001
  # (dibuat oleh fase ai-rest; lihat osc_docs/rest/api-core-foundation.md).
  # ---------------------------------------------------------------------------
  osc_rest:
    build:
      context: ./osc_rest
      dockerfile: Dockerfile
    image: omnisight/osc_rest:latest
    container_name: osc_rest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - "no-new-privileges:true"
    environment:
      - TZ=${TZ:-Asia/Jakarta}
      - REST_HOST=0.0.0.0
      - REST_PORT=${REST_PORT:-8000}
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${PG_USER:-dbe}:${PG_PASS:-password_osc_dbe}@osc_base:5432/${PG_DATA:-osc}?sslmode=disable
      - RUSTFS_ENDPOINT=http://osc_file:9000
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-oscadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-password_osc_rustfs}
      - RUSTFS_BUCKET=${RUSTFS_BUCKET:-osc}
      # Bucket per-fungsi (dibuat otomatis oleh osc_save)
      - RUSTFS_BUCKET_FILES=${RUSTFS_BUCKET_FILES:-osc-assets-files}
      - RUSTFS_BUCKET_PAM=${RUSTFS_BUCKET_PAM:-osc-pam-recordings}
      - RUSTFS_BUCKET_BACKUPS=${RUSTFS_BUCKET_BACKUPS:-osc-config-backups}
      # Keamanan & kriptografi (lihat .env.example — ganti semua default di staging/prod)
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-change_me_jwt_access_secret_32bytes}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_me_jwt_refresh_secret_32bytes}
      - APP_MASTER_ENCRYPTION_KEY=${APP_MASTER_ENCRYPTION_KEY:-change_me_master_kek_32bytes}
      - AGENT_ENROLLMENT_SECRET=${AGENT_ENROLLMENT_SECRET:-change_me_agent_enrollment_secret}
      - HRIS_ALLOWED_HOSTS=${HRIS_ALLOWED_HOSTS:-hris.internal.example.local}
      # Bootstrap seeder Day-2 (reengineering.md bab 5.8)
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-superadmin}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-superadmin@example.local}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-change_me_on_first_login}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${REST_PORT:-8000}/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      osc_base:
        condition: service_healthy
      osc_file:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      blackbox:
        ipv4_address: 172.99.66.3

  # ---------------------------------------------------------------------------
  # Next.js UI + BFF Proxy
  # BFF wajib memanggil Rust API server-to-server via RUST_API_INTERNAL_URL;
  # browser tidak pernah berkomunikasi langsung dengan osc_rest.
  # Dockerfile: multi-stage node:22-alpine standalone, non-root UID 1001
  # (dibuat oleh fase ai-site; lihat osc_docs/site/proxy-and-architecture.md).
  # ---------------------------------------------------------------------------
  osc_site:
    build:
      context: ./osc_site
      dockerfile: Dockerfile
    image: omnisight/osc_site:latest
    container_name: osc_site
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - "no-new-privileges:true"
    environment:
      - TZ=${TZ:-Asia/Jakarta}
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=${SITE_PORT:-3000}
      - RUST_API_INTERNAL_URL=http://osc_rest:${REST_PORT:-8000}
    ports:
      - "${SITE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${SITE_PORT:-3000}/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      osc_rest:
        condition: service_healthy
      osc_file:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      blackbox:
        ipv4_address: 172.99.66.4
