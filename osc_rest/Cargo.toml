[package]
name = "osc_rest"
version = "0.1.0"
edition = "2024"
description = "omnisight core REST API (Clean Architecture: domain/application/infrastructure/presentation)"

[dependencies]
# --- Presentation (HTTP) ---
axum = "0.8"

# --- Runtime async ---
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

# --- Infrastructure: PostgreSQL (query runtime, bukan macro compile-time) ---
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres"] }

# --- Infrastructure: RustFS (S3-compatible object storage) ---
aws-sdk-s3 = "1"

# --- Serialisasi DTO ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Observability (log JSON terstruktur + env filter) ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- Identifier: correlation ID (UUIDv7) + kunci object storage fase excel ---
uuid = { version = "1", features = ["v4", "v7"] }

# --- Error ergonomis + mapping aman ke HTTP ---
thiserror = "2"

# --- Excel import/export (dipakai pada fase excel berikutnya) ---
calamine = "0.38"
rust_xlsxwriter = "0.102"

[dev-dependencies]
# ServiceExt::oneshot untuk pengujian middleware (versi selaras axum 0.8)
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
