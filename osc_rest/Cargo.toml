[package]
name = "osc-rest"
version = "0.1.0"
edition = "2021"
default-run = "osc-rest"

[dependencies]
snmp2 = { version = "0.5.3", features = ["heap_buffers"] }
redis = { version = "1.8", default-features = false, features = ["tokio-comp"] }
argon2 = "0.5"
data-encoding = "2"
der = "0.7"
futures-util = "0.3"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process"] }
axum = { version = "0.8", default-features = false, features = ["matched-path", "tokio", "http1", "json", "query", "ws"] }
http-body-util = "0.1"
http-body = "1"
base64 = "0.22"
ring = "0.17"
serde_json = "1"
jsonwebtoken = { version = "9", default-features = false }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
bollard = "0.19"

tempfile = "3"
russh = { version = "0.57", default-features = false, features = ["ring"] }
jsonschema = { version = "0.37", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate"] }
