# nginx — TLS + reverse proxy untuk OmniSight
#
# Prasyarat: certbot (Let's Encrypt) atau sertifikat lain. Ganti `example.com`.
# Backend (:37772) dan database (:37771) harus tetap hanya di localhost.

# Rate limit login (letakkan di dalam blok `http {}` pada nginx.conf utama):
#   limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
#   limit_req_status 429;

server {
	listen 80;
	listen [::]:80;
	server_name example.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name example.com;

	ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;

	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	client_max_body_size 25m;
	server_tokens off;

	# Terapkan `limit_req zone=login burst=5 nodelay;` pada endpoint login
	# bila rate-limit backend tidak mencukupi.

	location / {
		proxy_pass http://127.0.0.1:37773;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Dukungan WebSocket (terminal PAM / live metric).
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}
