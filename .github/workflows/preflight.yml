name: preflight

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate documentation
        run: python3 osc_docs/tools/validate_docs.py
      - name: Validate contracts
        run: python3 osc_docs/technical/contracts/validate_contracts.py
      - name: Scan for secrets
        run: python3 osc_docs/tools/scan_secrets.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - name: Format
        working-directory: osc_rest
        run: cargo fmt --all --check
      - name: Lint
        working-directory: osc_rest
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        working-directory: osc_rest
        run: cargo test --locked
      - name: Build release
        working-directory: osc_rest
        run: cargo build --locked --release

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: osc_auto/go.mod
      - name: Vet
        working-directory: osc_auto
        run: go vet ./...
      - name: Unit tests
        working-directory: osc_auto
        run: go test ./...
      - name: Build
        working-directory: osc_auto
        run: go build ./...

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: osc_site/package-lock.json
      - name: Install
        working-directory: osc_site
        run: npm ci
      - name: Lint and type check
        working-directory: osc_site
        run: npm run lint
      - name: Unit tests
        working-directory: osc_site
        run: npm test
      - name: Build
        working-directory: osc_site
        run: npm run build

  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: osc_base/package-lock.json
      - name: Install
        working-directory: osc_base
        run: npm ci
      - name: Validate Prisma schema
        working-directory: osc_base
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/omnisight
        run: npm run validate

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: >-
          docker compose -f deploy/compose/core.compose.yaml
          --env-file deploy/compose/.env.example config
